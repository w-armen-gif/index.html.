<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Օնլայն Գրադարան</title>
    <!-- EmailJS գրադարան՝ իրական նամակներ ուղարկելու համար -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #1e3799;
            --secondary: #4a69bd;
            --accent: #f6b93b;
            --bg: #f1f2f6;
            --card-bg: #ffffff;
            --text: #2f3542;
            --green-progress: #2ed573;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        /* Սկզբնական գրանցման պատուհան */
        #loginModal {
            position: fixed;
            inset: 0;
            background: rgba(30, 55, 153, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }

        .login-box {
            background: white;
            padding: 35px;
            border-radius: 18px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            color: var(--primary);
            margin-top: 0;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1.5px solid #dcdde1;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background: var(--secondary);
        }

        /* Վերնագիր և մեջբերում */
        header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .quote {
            font-style: italic;
            max-width: 700px;
            margin: 10px auto 0;
            opacity: 0.9;
            font-size: 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-input {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1.5px solid #ced6e0;
            width: 280px;
            font-size: 15px;
        }

        .user-info-pill {
            background: white;
            padding: 8px 18px;
            border-radius: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-trigger {
            background: #2f3542;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
        }

        /* Գրքերի ցանց */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            max-width: 1200px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .book-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s;
        }

        .book-card:hover {
            transform: translateY(-4px);
        }

        .book-num {
            font-size: 12px;
            font-weight: bold;
            color: var(--secondary);
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 12px;
            align-self: flex-start;
        }

        .hit-badge {
            position: absolute;
            top: 18px;
            right: 18px;
            background: #ff4757;
            color: white;
            font-size: 11px;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .book-title {
            font-size: 18px;
            margin: 12px 0 5px;
            color: var(--primary);
        }

        .book-author {
            font-size: 14px;
            color: #747d8c;
            margin-bottom: 8px;
        }

        .book-desc {
            font-size: 13px;
            color: #57606f;
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .rating-box {
            color: #ffa502;
            font-size: 16px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .rule-note {
            font-size: 12px;
            color: #57606f;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        /* 7-օրյա աստիճանաբար կանաչող գիծ */
        .progress-wrapper {
            margin: 10px 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: #dfe4ea;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #a3cb38, #2ed573);
            width: 0%;
            transition: width 0.5s ease;
        }

        .status-busy {
            color: #ff4757;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .btn-reserve {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .btn-waitlist {
            background: #ffa502;
            color: white;
            border: none;
            padding: 9px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 6px;
        }

        /* Սեփականատիրոջ Admin Panel */
        #adminModal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .admin-content {
            background: white;
            padding: 25px;
            border-radius: 16px;
            width: 95%;
            max-width: 850px;
            max-height: 85vh;
            overflow-y: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #dfe4ea;
            padding: 10px;
            text-align: left;
        }

        th {
            background: var(--primary);
            color: white;
        }

        .btn-small {
            padding: 6px 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>

    <!-- 1. Գրանցման պատուհան -->
    <div id="loginModal">
        <div class="login-box">
            <h2>Բարի գալուստ մեր գրադարան</h2>
            <p style="font-size: 14px; color: #57606f;">Բարի գալուստ մեր կայք։ Մուտքագրեք Ձեր տվյալները՝ գրքերից օգտվելու համար</p>
            <input type="text" id="firstName" placeholder="Անուն" required>
            <input type="text" id="lastName" placeholder="Ազգանուն" required>
            <input type="email" id="userEmail" placeholder="Էլ. փոստ (Mail)" required>
            <button class="btn" onclick="registerUser()">Հաստատել</button>
        </div>
    </div>

    <!-- 2. Գլխավոր վերնագիր -->
    <header>
        <h1>Օնլայն Գրադարան</h1>
        <p class="quote">«Լավ գիրք կարդալը նման է անցյալ դարերի լավագույն մարդկանց հետ զրուցելուն։» — Ռենե Դեկարտ</p>
    </header>

    <!-- 3. Որոնում, Ընթերցողի քարտ և Սեփականատիրոջ մուտք -->
    <div class="top-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Որոնել գիրք կամ հեղինակ..." oninput="renderBooks()">
        <div class="user-info-pill">
            <span id="welcomeUser">Ընթերցող՝ Հյուր</span>
            <span id="myBooksCount" style="color: var(--primary); font-weight: bold;">Իմ գրքերը՝ 0</span>
            <button class="admin-trigger" onclick="openAdmin()">Սեփականատիրոջ մուտք</button>
        </div>
    </div>

    <!-- 4. Գրքերի ցանկ -->
    <div class="books-grid" id="booksGrid"></div>

    <!-- 5. Սեփականատիրոջ կառավարման վահանակ (Admin Panel) -->
    <div id="adminModal">
        <div class="admin-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
